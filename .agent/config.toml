[agent]
default_mode = "agent"
max_turns = 40

[models]
backend = "ollama"
auto_route = true
memory_budget_gb = 20

[permissions]
# Development tools run without approval by default. Set false to enforce the
# risk-specific policies below.
unrestricted = true
network = "allow"
outside_workspace_write = "allow"
credentials = "allow"
destructive = "allow"
privilege = "allow"

[web_search]
# `{query}` is percent-encoded before substitution.
endpoint = "https://html.duckduckgo.com/html/?q={query}"

[execution]
timeout_seconds = 120
