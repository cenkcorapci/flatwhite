name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev libsqlite3-dev pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          # curl and sqlite ship with the runner; cmake is preinstalled

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFLATWHITE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: CLI smoke
        run: |
          ./build/flatwhite --help
          ./build/flatwhite --version
          FLATWHITE_FAKE_MODEL=1 ./build/flatwhite -p "hello" --output-format text --data-dir "$RUNNER_TEMP/flatwhite-data"

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev libsqlite3-dev pkg-config

      - name: Configure with sanitizers
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFLATWHITE_BUILD_TESTS=ON \
            -DFLATWHITE_ENABLE_ASAN=ON \
            -DFLATWHITE_ENABLE_UBSAN=ON

      - name: Build
        run: cmake --build build-san --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build-san --output-on-failure --parallel 2
